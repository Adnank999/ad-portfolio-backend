services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_DB: portfolio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - portfolio_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ad-portfolio-api:local

    depends_on:
      db:
        condition: service_healthy

    env_file:
      - .env.portfolio

    environment:
      SERVICE_HOST: 0.0.0.0
      SERVICE_PORT: ${SERVICE_PORT:-8080}
      DATABASE_URL: "postgresql://portfolio:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/portfolio"

    ports:
      - "127.0.0.1:${SERVICE_PORT:-8080}:${SERVICE_PORT:-8080}"

    restart: unless-stopped
    init: true
    stop_signal: SIGINT
    stop_grace_period: 30s

volumes:
  portfolio_pgdata:
